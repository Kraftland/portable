name: Build daemon (debug)

on:
  release:
    types: released
  pull_request:
    branches: [ "master" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Rust
      run: sudo apt-get install cargo -y

    - name: Install Dependencies
      run: sudo apt update && sudo apt install -y libudev-dev systemd libsystemd-dev

    - name: Initialise submodules
      run: git submodule update --init --recursive

    - name: Build daemon (Debug)
      run: |
        cargo fetch --locked --target host-tuple
        cargo build --frozen --release