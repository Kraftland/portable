name: Setup build environment (checkout first)

on:
  workflow_call:

runs:
  using: composite
  steps:
    runs-on: ubuntu-latest
    steps:
    - name: Update host
      run: sudo apt-get update

    - name: Install Dependencies
      run: sudo apt install -y libudev-dev systemd libsystemd-dev

    - name: Initialise submodules
      run: git submodule update --init --recursive