name: Clippy inspector

on:
  release:
    types: released
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]


jobs:

  build:
    runs-on: ubuntu-latest
    steps:

    - uses: ./.github/workflows/pre-run.yml

    - name: Run clippy
      run: |
        cargo fetch --locked --target host-tuple
        cargo clippy