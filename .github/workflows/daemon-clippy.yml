name: Clippy inspector

on:
  release:
    types: released
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

jobs:
  setup:
    uses: ./.github/workflows/pre-run.yml

  build:
    needs: setup
    runs-on: ubuntu-latest
    steps:

    - name: Run clippy
      run: |
        cargo fetch --locked --target host-tuple
        cargo clippy