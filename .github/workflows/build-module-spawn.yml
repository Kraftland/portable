name: Build submodule Flatpak stub

on:
  release:
    types: released
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version-file: 'lib/flatpak-spawn-stub/go.mod'

    - name: Initialise submodules
      run: git submodule update --init --recursive

    - name: Build
      run: |
        cd lib/flatpak-spawn-stub
        go build