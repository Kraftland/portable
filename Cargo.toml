[package]
name = "portable-daemon"
version = "20.0.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
legacy_conf = { path = "./lib/legacy_conf" }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "signal", "fs", "io-util"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
nix = { version = "0.31.3", features = ["term"] }
jiff = { version = "0.2.34", features = ["std"], default-features = false }
toml = { version = "1.1.3", features = ["parse", "serde"], default-features = false }
udev = { version = "0.9.3", features = ["send", "sync"], default-features = false }
zbus = { version = "5.18.0", features = ["async-executor", "async-fs", "async-io", "async-lock", "async-process", "async-task", "tokio"], default-features = false }
zbus_systemd = { version = "0.26100.0", features = ["systemd1"], default-features = false }

[workspace]
resolver = "3"
members = ["lib/legacy_conf"]
exclude = ["lib/init"]

[features]
default = ["systemd", "flatpak"]
systemd = []

# Mimic Flatpak to host, required until appd lands
flatpak = []
